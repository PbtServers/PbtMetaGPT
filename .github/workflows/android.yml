name: Android
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    name: Pruebas y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      resumen: ${{ steps.resumen.outputs.resumen }}
    steps:
      - uses: actions/checkout@v4
      - name: Publicar enlace y estado de esta ejecución
        if: github.event_name != 'pull_request'
        env:
          PBT_CI_STATUS_TOKEN: ${{ github.token }}
        run: python3 tools/publicar_estado_ci.py pending
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar herramienta ELF para aislar runtimes nativos
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar el backend sin llamadas reales
        run: node --test backend/*.test.mjs
      - name: Compilar, analizar y probar Android
        id: compilacion
        shell: bash
        run: |
          python3 tools/preparar_fonemizador.py
          python3 tools/preparar_sherpa.py
          bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee compilacion.log
      - name: Extraer diagnóstico de compilación sin datos de usuario
        if: failure()
        id: fallo
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=Path('compilacion.log').read_text(errors='replace').splitlines() if Path('compilacion.log').exists() else []
          errors=[re.sub(r'[^a-zA-Z0-9 áéíóúÁÉÍÓÚñÑ_.,:()<>/=+!?-]', '', x)[-220:] for x in lines if x.startswith('e: ') or ' > ' in x and 'FAILED' in x]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('resumen='+' | '.join(errors[:4])[:850]+'\n')
          PY
      - name: 'Diagnóstico: ${{ steps.fallo.outputs.resumen }}'
        if: failure()
        run: echo 'Consulta el informe completo de compilación y pruebas.'
      - name: Comprobar ausencia de claves privadas en fuentes y APK
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/comprobar_secretos.py --informe app/build/reports/seguridad/hallazgos.json app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -F "android.permission.ACCESS_NETWORK_STATE"
      - name: Resumir hallazgos del escáner sin mostrar candidatos
        if: failure()
        id: seguridad
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('app/build/reports/seguridad/hallazgos.json')
          r=json.loads(p.read_text()) if p.exists() else {}
          summary=json.dumps(r.get('hallazgos',[]),ensure_ascii=True,separators=(',',':'))[:3000]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('resumen='+summary+'\n')
          PY
      - name: 'Seguridad: ${{ steps.seguridad.outputs.resumen }}'
        if: failure()
        run: echo 'Metadatos de atribución exclusivamente; los hallazgos siguen bloqueando la APK.'
      - name: Contar pruebas JVM y conservar evidencia numérica
        if: always()
        id: resumen
        run: |
          python3 - <<'PY'
          import os,json,xml.etree.ElementTree as ET
          from pathlib import Path
          counts={'tests':0,'failures':0,'errors':0,'skipped':0}
          for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              r=ET.parse(p).getroot()
              for k in counts: counts[k]+=int(r.attrib.get(k,0))
          summary=json.dumps(counts,separators=(',',':'))
          p=Path('app/build/reports/resumen-jvm.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(summary)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('resumen='+summary+'\n')
          PY
      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-validacion
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Publicar resultado de validación por SHA
        if: always() && github.event_name != 'pull_request'
        env:
          PBT_CI_STATUS_TOKEN: ${{ github.token }}
        run: python3 tools/publicar_estado_ci.py '${{ job.status }}'
  emulador:
    name: Android API ${{ matrix.api }} · audio y persistencia
    needs: [validar, contenedores]
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      resumen: ${{ steps.resumen.outputs.resumen }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar herramienta ELF para aislar runtimes nativos
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
      - name: Preparar runtime de síntesis verificado
        run: |
          python3 tools/preparar_fonemizador.py
          python3 tools/preparar_sherpa.py
          python3 tools/preparar_modelo_prueba.py
          python3 tools/preparar_kokoro_prueba.py
          python3 tools/preparar_activacion_prueba.py
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar Android Keystore real del emulador sin claves ni llamadas reales
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          script: bash tools/probar_android.sh
      - name: Resumir resultados del emulador sin logs de usuario
        if: always()
        id: resumen
        env:
          API: ${{ matrix.api }}
        run: |
          python3 - <<'PY'
          import os,json,xml.etree.ElementTree as ET
          from pathlib import Path
          r={'api':int(os.environ['API']),'tests':0,'fallos':[]}
          for phase in ('sin-microfono','con-microfono'):
              for p in (Path('app/build/reports/androidTests')/phase).rglob('TEST-*.xml'):
                  root=ET.parse(p).getroot();r['tests']+=int(root.attrib.get('tests',0))
                  for case in root.findall('testcase'):
                      if case.find('failure') is not None or case.find('error') is not None: r['fallos'].append(case.attrib.get('name',''))
          summary=json.dumps(r,ensure_ascii=True,separators=(',',':'))
          p=Path('app/build/reports/androidTests/resumen.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(summary)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('resumen='+summary+'\n')
              out.write('cantidad='+str(r['tests'])+'\nfallos='+str(len(r['fallos']))+'\n')
          PY
      - name: Publicar informe del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-emulador-api-${{ matrix.api }}-${{ steps.resumen.outputs.cantidad }}-pruebas-${{ steps.resumen.outputs.fallos }}-fallos
          path: app/build/reports/androidTests/
      - name: Verificar APK final sin claves privadas
        run: python3 tools/comprobar_secretos.py --informe app/build/reports/seguridad/hallazgos.json app/build/outputs/apk/debug/app-debug.apk
  contenedores:
    name: Backend Docker y proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOMAIN: localhost
      ACME_EMAIL: pruebas@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Preparar secretos ficticios de CI
        run: |
          mkdir -p deploy/secrets
          printf 'clave-ficticia-de-ci' > deploy/secrets/openai_api_key
          printf 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > deploy/secrets/client_token_sha256
          chmod 444 deploy/secrets/*
      - name: Validar la configuración HTTPS de producción
        run: |
          docker compose -f deploy/compose.yml config --quiet
          docker run --rm -e DOMAIN -e ACME_EMAIL -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Arrancar y comprobar backend y proxy
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.ci.yml up --build --wait --wait-timeout 120
      - name: Comprobar salud mediante el proxy
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:18080/healthz
      - name: Rechazar acceso sin token
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -X POST http://localhost:18080/realtime/client-secret)
          echo "Estado HTTP sin autenticación: $status"
          test "$status" = 401
      - name: Comprobar aislamiento del puerto del backend
        run: |
          container=$(docker compose -f deploy/compose.yml -f deploy/compose.ci.yml ps -q backend)
          docker inspect "$container" --format '{{json .NetworkSettings.Ports}}' | jq -e 'all(.[]; . == null)'
      - name: Detener contenedores de prueba
        if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml down --volumes
  publicar:
    name: APK experimental tras validar ambas versiones Android
    needs: [validar, emulador, contenedores]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar herramienta ELF para aislar runtimes nativos
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
      - name: Preparar y comprobar APK del mismo SHA validado
        run: |
          python3 tools/preparar_fonemizador.py
          python3 tools/preparar_sherpa.py
          bash ./gradlew --no-daemon assembleDebug
          python3 tools/comprobar_secretos.py --informe app/build/reports/seguridad/hallazgos.json app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -F "android.permission.ACCESS_NETWORK_STATE"
      - name: Obtener versión de la aplicación
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          matches = re.findall(r'^\s*versionName\s*=\s*"([^"]+)"', gradle, re.MULTILINE)
          if len(matches) != 1 or not re.fullmatch(r'[0-9A-Za-z][0-9A-Za-z.+-]{0,60}', matches[0]):
              raise SystemExit('versionName ausente, duplicado o no válido')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'name=PbtMetaGPT-v{matches[0]}-debug\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  evidencia:
    if: always()
    needs: [validar, emulador]
    name: 'Evidencia: JVM ${{ needs.validar.outputs.resumen }}; último emulador ${{ needs.emulador.outputs.resumen }}'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Los informes de cada API se conservan por separado. Este resumen no sustituye las verificaciones obligatorias.'
