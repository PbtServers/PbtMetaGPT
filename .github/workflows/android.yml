name: Android
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    name: Pruebas y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar el backend sin llamadas reales
        run: node --test backend/*.test.mjs
      - name: Compilar, analizar y probar Android
        run: |
          python3 tools/preparar_sherpa.py
          bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Comprobar ausencia de claves privadas en fuentes y APK
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/comprobar_secretos.py --informe app/build/reports/seguridad/hallazgos.json app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -F "android.permission.ACCESS_NETWORK_STATE"
      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-validacion
          path: |
            app/build/reports/
            app/build/test-results/
  emulador:
    name: Android API ${{ matrix.api }} · audio y persistencia
    needs: [validar, contenedores]
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar runtime de síntesis verificado
        run: |
          python3 tools/preparar_sherpa.py
          python3 tools/preparar_modelo_prueba.py
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar Android Keystore real del emulador sin claves ni llamadas reales
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          script: bash tools/probar_android.sh
      - name: Publicar informe del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-emulador-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
      - name: Verificar APK final sin claves privadas
        run: python3 tools/comprobar_secretos.py --informe app/build/reports/seguridad/hallazgos.json app/build/outputs/apk/debug/app-debug.apk
  contenedores:
    name: Backend Docker y proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOMAIN: localhost
      ACME_EMAIL: pruebas@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Preparar secretos ficticios de CI
        run: |
          mkdir -p deploy/secrets
          printf 'clave-ficticia-de-ci' > deploy/secrets/openai_api_key
          printf 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > deploy/secrets/client_token_sha256
          chmod 444 deploy/secrets/*
      - name: Validar la configuración HTTPS de producción
        run: |
          docker compose -f deploy/compose.yml config --quiet
          docker run --rm -e DOMAIN -e ACME_EMAIL -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Arrancar y comprobar backend y proxy
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.ci.yml up --build --wait --wait-timeout 120
      - name: Comprobar salud mediante el proxy
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:18080/healthz
      - name: Rechazar acceso sin token
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -X POST http://localhost:18080/realtime/client-secret)
          echo "Estado HTTP sin autenticación: $status"
          test "$status" = 401
      - name: Comprobar aislamiento del puerto del backend
        run: |
          container=$(docker compose -f deploy/compose.yml -f deploy/compose.ci.yml ps -q backend)
          docker inspect "$container" --format '{{json .NetworkSettings.Ports}}' | jq -e 'all(.[]; . == null)'
      - name: Detener contenedores de prueba
        if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml down --volumes
  publicar:
    name: APK experimental tras validar ambas versiones Android
    needs: [validar, emulador, contenedores]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar y comprobar APK del mismo SHA validado
        run: |
          python3 tools/preparar_sherpa.py
          bash ./gradlew --no-daemon assembleDebug
          python3 tools/comprobar_secretos.py --informe app/build/reports/seguridad/hallazgos.json app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -F "android.permission.ACCESS_NETWORK_STATE"
      - uses: actions/upload-artifact@v4
        with:
          name: PbtMetaGPT-v0.4.1-dev-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
