name: Android
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    name: Pruebas y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar el backend sin llamadas reales
        run: node --test backend/*.test.mjs
      - name: Compilar, analizar y probar Android
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-validacion
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: PbtMetaGPT-v0.3.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  contenedores:
    name: Backend Docker y proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOMAIN: localhost
      ACME_EMAIL: pruebas@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Preparar secretos ficticios de CI
        run: |
          mkdir -p deploy/secrets
          printf 'clave-ficticia-de-ci' > deploy/secrets/openai_api_key
          printf 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > deploy/secrets/client_token_sha256
          chmod 444 deploy/secrets/*
      - name: Validar la configuración HTTPS de producción
        run: |
          docker compose -f deploy/compose.yml config --quiet
          docker run --rm -e DOMAIN -e ACME_EMAIL -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Arrancar y comprobar backend y proxy
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.ci.yml up --build --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:18080/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://localhost:18080/realtime/client-secret)" = 401
          test -z "$(docker compose -f deploy/compose.yml -f deploy/compose.ci.yml port backend 8787 2>/dev/null || true)"
      - name: Detener contenedores de prueba
        if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml down --volumes
