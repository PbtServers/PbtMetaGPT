name: Latencia real de voz online
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/servicios-online.yml']
permissions:
  contents: read
concurrency:
  group: prueba-qwen-publica
  cancel-in-progress: false
jobs:
  qwen-real:
    name: Comparación real Qwen sin mocks ni token
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/preparar_sherpa.py
      - name: Dos síntesis reales con el cliente Kotlin de la app, sin reintentos
        id: medir
        env:
          PBT_QWEN_LIVE: '1'
        run: bash ./gradlew --no-daemon testDebugUnitTest --tests '*QwenLivePerformanceTest' 2>&1 | tee compilacion.log
      - name: Extraer diagnóstico de compilación sin datos de usuario
        if: failure()
        id: fallo
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=Path('compilacion.log').read_text(errors='replace').splitlines() if Path('compilacion.log').exists() else []
          errors=[re.sub(r'[^a-zA-Z0-9 áéíóúÁÉÍÓÚñÑ_.,:()<>/=+!?-]', '', x)[-220:] for x in lines if x.startswith('e: ') or ' > ' in x and 'FAILED' in x]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('resumen='+' | '.join(errors[:4])[:850]+'\n')
          PY
      - name: 'Diagnóstico: ${{ steps.fallo.outputs.resumen }}'
        if: failure()
        run: echo 'Consulta el informe completo de compilación y pruebas.'
      - name: Verificar evidencia real y leer tiempos del informe
        id: evidencia
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('app/build/reports/qwen-latencia-real.json')
          assert p.is_file(), 'No existe informe real: no se acepta una prueba omitida o en caché'
          r=json.loads(p.read_text())
          assert r.get('resultado') == 'CORRECTO_REAL', 'La inferencia remota no se completó'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('completo_ms='+str(r['completo_ms']['TOTAL'])+'\n')
              out.write('fragmento_ms='+str(r['primer_fragmento_ms']['TOTAL'])+'\n')
          PY
      - name: 'PCM disponible: completo ${{ steps.evidencia.outputs.completo_ms }} ms; primer fragmento ${{ steps.evidencia.outputs.fragmento_ms }} ms'
        run: echo "La métrica mide disponibilidad PCM, no sonido físico ni Bluetooth."
      - name: Conservar resultado incluso si cuota o servicio rechazan la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-latencia-real
          path: |
            app/build/reports/qwen-latencia-real.json
            app/build/test-results/testDebugUnitTest/
